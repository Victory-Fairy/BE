name: be

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: victoryfairy_dev
      MYSQL_USER: victoryfairy
      MYSQL_PASSWORD: victoryfairy
      MYSQL_ROOT_PASSWORD: local-root
      TZ: Asia/Seoul
    ports:
      - "3308:3306"
    volumes:
      - mysql-dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal-root"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.0-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-dev:
