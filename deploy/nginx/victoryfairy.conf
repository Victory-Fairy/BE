server {
    listen 80;
    server_name api.seungyo.shop;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.seungyo.shop;

    ssl_certificate /etc/letsencrypt/live/api.seungyo.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.seungyo.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /v2/api/swagger-ui/ {
        rewrite ^/v2/api/swagger-ui/(.*)$ /v2/swagger-ui/$1 break;
        proxy_pass http://api:8081;
    }

    location /v2/api/ {
        proxy_pass http://api:8081;
    }

    location /v2/file/ {
        proxy_pass http://api:8081;
    }

    location /v2/admin/ {
        proxy_pass http://admin:8084;
    }
}
