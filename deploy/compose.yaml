name: victoryfairy

x-app-environment: &app-environment
  TZ: ${TZ}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_DATABASE: "1"
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate

x-app-common: &app-common
  env_file: ${APP_ENV_FILE:-/opt/victoryfairy/.env}
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/victoryfairy/nginx/victoryfairy.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/victoryfairy/nginx/metrics.htpasswd:/etc/nginx/metrics.htpasswd:ro
      - /opt/victoryfairy/letsencrypt:/etc/letsencrypt:ro

  redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    command: redis-server --save 60 1
    volumes:
      - /opt/victoryfairy/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app-common
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:api-${IMAGE_TAG}
    environment:
      <<: *app-environment
      SERVER_PORT: "8081"
      SERVER_SERVLET_CONTEXT_PATH: /v2
      SPRINGDOC_API_DOCS_PATH: /api/v3/api-docs
      SPRINGDOC_SWAGGER_UI_CONFIG_URL: /v2/api/v3/api-docs/swagger-config
      SPRINGDOC_SWAGGER_UI_URL: /v2/api/v3/api-docs
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES_HISTOGRAM_HTTP_SERVER_REQUESTS: "true"
      DECORATOR_DATASOURCE_DATASOURCE_PROXY_QUERY_ENABLE_LOGGING: "false"
      DECORATOR_DATASOURCE_DATASOURCE_PROXY_SLOW_QUERY_ENABLE_LOGGING: "false"
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/admin/,file:/config/file/,file:/config/api/
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx1024m
    volumes:
      - /opt/victoryfairy/config/api:/config/api:ro
      - /opt/victoryfairy/config/admin:/config/admin:ro
      - /opt/victoryfairy/config/file:/config/file:ro

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    pid: host
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /:/host:ro,rslave

  craw:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:craw-${IMAGE_TAG}
    profiles: [jobs]
    env_file: ${APP_ENV_FILE:-/opt/victoryfairy/.env}
    init: true
    environment:
      <<: *app-environment
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx512m
    volumes:
      - /opt/victoryfairy/config/craw:/config:ro
    depends_on:
      redis:
        condition: service_healthy
