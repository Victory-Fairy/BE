name: victoryfairy

x-app-environment: &app-environment
  TZ: ${TZ}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_DATABASE: "1"

x-app-common: &app-common
  env_file: ${APP_ENV_FILE:-/opt/victoryfairy/.env}
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/victoryfairy/nginx/victoryfairy.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/victoryfairy/letsencrypt:/etc/letsencrypt:ro

  redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    command: redis-server --save 60 1
    volumes:
      - /opt/victoryfairy/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app-common
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:api-${IMAGE_TAG}
    environment:
      <<: *app-environment
      SERVER_PORT: "8081"
      SERVER_SERVLET_CONTEXT_PATH: /v2
      SPRINGDOC_API_DOCS_PATH: /api/v3/api-docs
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/admin/,file:/config/file/,file:/config/api/
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx1024m
    volumes:
      - /opt/victoryfairy/config/api:/config/api:ro
      - /opt/victoryfairy/config/admin:/config/admin:ro
      - /opt/victoryfairy/config/file:/config/file:ro

  file:
    <<: *app-common
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:file-latest
    environment:
      <<: *app-environment
      SERVER_PORT: "8082"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    volumes:
      - /opt/victoryfairy/config/file:/config:ro

  admin:
    <<: *app-common
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:admin-latest
    environment:
      <<: *app-environment
      SERVER_PORT: "8084"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m
    volumes:
      - /opt/victoryfairy/config/admin:/config:ro

  craw:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:craw-${IMAGE_TAG}
    profiles: [jobs]
    env_file: ${APP_ENV_FILE:-/opt/victoryfairy/.env}
    init: true
    environment:
      <<: *app-environment
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx512m
    volumes:
      - /opt/victoryfairy/config/craw:/config:ro
    depends_on:
      redis:
        condition: service_healthy
