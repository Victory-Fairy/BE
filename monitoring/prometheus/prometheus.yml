global:
  scrape_interval: 30s

scrape_configs:
  - job_name: victoryfairy-api
    scheme: https
    metrics_path: /v2/actuator/prometheus
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/secrets/metrics-password
    static_configs:
      - targets: [api.seungyo.shop]

  - job_name: victoryfairy-ec2
    static_configs:
      - targets: [host.docker.internal:19100]
